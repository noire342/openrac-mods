name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mods:
    name: ${{ matrix.mod }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        mod: [weapon-xp, revolverator, arsenal-compat, arsenal-file-overlay]
        include:
          - mod: weapon-xp
            xp: 'ON'
            revolverator: 'OFF'
            compat: 'OFF'
            overlay: 'OFF'
          - mod: revolverator
            xp: 'OFF'
            revolverator: 'ON'
            compat: 'ON'
            overlay: 'ON'
          - mod: arsenal-compat
            xp: 'OFF'
            revolverator: 'OFF'
            compat: 'ON'
            overlay: 'OFF'
          - mod: arsenal-file-overlay
            xp: 'OFF'
            revolverator: 'OFF'
            compat: 'OFF'
            overlay: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch pinned SDK
        run: python tools/fetch_sdk.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_WEAPON_XP=${{ matrix.xp }} -DBUILD_REVOLVERATOR=${{ matrix.revolverator }} -DBUILD_ARSENAL_COMPAT=${{ matrix.compat }} -DBUILD_ARSENAL_FILE_OVERLAY=${{ matrix.overlay }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify Revolverator ELF service
        if: runner.os == 'Linux' && matrix.mod == 'revolverator'
        run: python tools/check_revolverator_exports.py build/revolverator/revolverator.so
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.mod }}-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest.log
