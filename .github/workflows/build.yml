name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mods:
    name: ${{ matrix.mod }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        mod: [weapon-xp, revolverator, arsenal-compat, arsenal-file-overlay, skill-points-ra, cinematic-journeys]
        include:
          - mod: weapon-xp
            skill_points: 'OFF'
            cinematic: 'OFF'
            xp: 'ON'
            revolverator: 'OFF'
            compat: 'OFF'
            overlay: 'OFF'
          - mod: revolverator
            skill_points: 'OFF'
            cinematic: 'OFF'
            xp: 'OFF'
            revolverator: 'ON'
            compat: 'ON'
            overlay: 'ON'
          - mod: arsenal-compat
            skill_points: 'OFF'
            cinematic: 'OFF'
            xp: 'OFF'
            revolverator: 'OFF'
            compat: 'ON'
            overlay: 'OFF'
          - mod: arsenal-file-overlay
            skill_points: 'OFF'
            cinematic: 'OFF'
            xp: 'OFF'
            revolverator: 'OFF'
            compat: 'OFF'
            overlay: 'ON'
          - mod: skill-points-ra
            xp: 'OFF'
            revolverator: 'OFF'
            compat: 'OFF'
            overlay: 'OFF'
            skill_points: 'ON'
            cinematic: 'OFF'
          - mod: cinematic-journeys
            xp: 'OFF'
            revolverator: 'OFF'
            compat: 'OFF'
            overlay: 'OFF'
            skill_points: 'OFF'
            cinematic: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch pinned SDK
        run: python tools/fetch_sdk.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_WEAPON_XP=${{ matrix.xp }} -DBUILD_REVOLVERATOR=${{ matrix.revolverator }} -DBUILD_ARSENAL_COMPAT=${{ matrix.compat }} -DBUILD_ARSENAL_FILE_OVERLAY=${{ matrix.overlay }} -DBUILD_SKILL_POINTS_RA=${{ matrix.skill_points }} -DBUILD_CINEMATIC_JOURNEYS=${{ matrix.cinematic }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify Revolverator ELF service
        if: runner.os == 'Linux' && matrix.mod == 'revolverator'
        run: python tools/check_revolverator_exports.py build/revolverator/revolverator.so
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.mod }}-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest.log
  standalone-current-sdk:
    name: ${{ matrix.mod }} / SDK 1.10.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        mod: [skill-points-ra, cinematic-journeys]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch standalone pinned SDK
        run: python ${{ matrix.mod }}/tools/fetch_sdk.py
      - name: Configure standalone
        run: cmake -S ${{ matrix.mod }} -B build-current -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-current --config Release --parallel
      - name: Test
        run: ctest --test-dir build-current -C Release --output-on-failure
      - name: Package from clean build
        run: python ${{ matrix.mod }}/tools/package_delivery.py --build build-current --output dist-current
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: current-sdk-${{ matrix.mod }}-${{ matrix.os }}
          path: |
            build-current/Testing/Temporary/LastTest.log
            dist-current/
