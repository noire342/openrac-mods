name: Space Voyages frozen baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  space:
    name: space-voyages / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: cmake -S space-voyages -B build-space -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build-space --config Release --parallel 2
      - run: ctest --test-dir build-space -C Release --output-on-failure
      - run: python -m unittest discover -s space-voyages/tools -p "test_*.py"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: space-tests-${{ matrix.os }}
          path: build-space/Testing/Temporary/LastTest.log